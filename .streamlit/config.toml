[theme]
base = "light"
primaryColor = "#208579"
backgroundColor = "#FAFBF9"
secondaryBackgroundColor = "#F1F4F1"
textColor = "#25332F"
linkColor = "#167568"
borderColor = "#DEE5DF"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
font = "sans-serif"
headingFontSizes = ["36px", "26px", "20px"]
paddingTop = "2rem"

[theme.sidebar]
backgroundColor = "#F1F4F1"
secondaryBackgroundColor = "#FFFFFF"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
